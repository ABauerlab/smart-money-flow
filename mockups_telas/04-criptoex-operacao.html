<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM — Operação</title>
<style>
  :root{
    --bg:#0a0e17; --card:#121826; --card2:#161d2e; --border:#232b3d;
    --primary:#22d3ee; --primary-dim:rgba(34,211,238,.15);
    --bull:#10b981; --bull-dim:rgba(16,185,129,.15);
    --bear:#ef4444; --bear-dim:rgba(239,68,68,.15); --warn:#f59e0b;
    --text:#e8edf5; --muted:#8a93a6; --muted2:#5c6478;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#000;display:flex;justify-content:center;padding:24px 0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;}
  .frame{width:390px;height:844px;background:var(--bg);color:var(--text);
    border-radius:44px;overflow:hidden;position:relative;
    box-shadow:0 0 0 10px #1c1c1e,0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:120px;height:30px;background:#000;border-radius:0 0 18px 18px;z-index:10;}
  .statusbar{height:46px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 22px 6px;font-size:14px;font-weight:600;flex-shrink:0;}
  .scroll{flex:1;overflow-y:auto;padding-bottom:20px;}
  .scroll::-webkit-scrollbar{display:none;}

  .topbar{padding:10px 16px 12px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;}
  .tb-l{display:flex;align-items:center;gap:9px;}
  .back{width:28px;height:28px;border-radius:9px;background:var(--card);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:13px;}
  .tb-l b{font-size:13px;font-weight:800;color:var(--primary);display:block;}
  .tb-l span{font-size:9px;color:var(--muted);}
  .code{font-size:10px;color:var(--muted);}

  .tabs{display:flex;padding:10px 16px 2px;border-bottom:1px solid var(--border);gap:4px;}
  .tab{flex:1;text-align:center;padding:9px 0;font-size:11px;font-weight:700;color:var(--muted);}
  .tab.active{color:var(--primary);border-bottom:2px solid var(--primary);}

  .disclaimer{padding:12px 16px;font-size:10px;color:var(--muted);line-height:1.5;
    border-bottom:1px solid var(--border);}

  .status-card{margin:14px 16px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:12px 14px;}
  .status-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--bull);box-shadow:0 0 6px var(--bull);
    animation:p 1.6s infinite;}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  .status-top span{font-size:10px;font-weight:800;color:var(--bull);letter-spacing:.4px;text-transform:uppercase;}
  .status-card b{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;}

  .switcher{display:flex;gap:8px;padding:0 16px 14px;overflow-x-auto;}
  .chip{padding:7px 14px;border-radius:10px;font-size:11px;font-weight:700;background:var(--card2);
    color:var(--muted);border:1px solid var(--border);}
  .chip.active{background:var(--primary);color:#031018;border-color:var(--primary);}

  .row{margin:0 16px 8px;display:flex;align-items:center;gap:11px;background:var(--card);
    border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .pos{width:24px;font-size:12px;font-weight:800;color:var(--muted2);}
  .pos.top{color:#eab308;}
  .sym{flex:1;font-size:13.5px;font-weight:700;font-family:monospace;}
  .count{font-size:14px;font-weight:800;margin-right:8px;}
  .trend{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:3px;}
  .trend.up{background:var(--bull-dim);color:var(--bull);}
  .trend.down{background:var(--bear-dim);color:var(--bear);}
  .trend.flat{background:var(--card2);color:var(--muted);}
  .trend.new{background:var(--primary-dim);color:var(--primary);}
</style>
</head>
<body>
<div class="frame">
  <div class="notch"></div>
  <div class="statusbar"><span>21:48</span><span>🔋 📶 📡</span></div>

  <div class="topbar">
    <div class="tb-l">
      <div class="back">←</div>
      <div><b>Observatório CriptoEx</b><span>Estudos consolidados</span></div>
    </div>
    <span class="code">Código: 77***</span>
  </div>

  <div class="scroll">
    <div class="tabs">
      <div class="tab active">📡 Operação</div>
      <div class="tab">📊 Listas</div>
      <div class="tab">📤 Enviar</div>
      <div class="tab">📋 Histórico</div>
    </div>

    <div class="status-card">
      <div class="status-top"><span class="dot"></span><span>Dado fresco</span></div>
      <b>🕐 Última leitura: 04/10, 21:48</b>
    </div>

    <div class="switcher">
      <span class="chip active">Atual</span>
      <span class="chip">19:50</span>
      <span class="chip">17:48</span>
      <span class="chip">15:45</span>
    </div>

    <div class="row"><span class="pos top">#1</span><span class="sym">NEAR</span><span class="count">5</span><span class="trend up">▲ 3</span></div>
    <div class="row"><span class="pos top">#2</span><span class="sym">AKT</span><span class="count">5</span><span class="trend up">▲ 2</span></div>
    <div class="row"><span class="pos top">#3</span><span class="sym">STRK</span><span class="count">5</span><span class="trend flat">— 5</span></div>
    <div class="row"><span class="pos">#4</span><span class="sym">SKY</span><span class="count">5</span><span class="trend new">✦ Novo</span></div>
    <div class="row"><span class="pos">#5</span><span class="sym">SHIB</span><span class="count">5</span><span class="trend down">▼ 7</span></div>
    <div class="row"><span class="pos">#6</span><span class="sym">VVV</span><span class="count">5</span><span class="trend up">▲ 4</span></div>
    <div class="row"><span class="pos">#7</span><span class="sym">DRV</span><span class="count">3</span><span class="trend flat">— 3</span></div>
    <div class="row"><span class="pos">#8</span><span class="sym">XTZ</span><span class="count">3</span><span class="trend down">▼ 5</span></div>
  </div>
</div>
</body>
</html>
