name: Health check e autocorreção (relatórios)

# Inspects the reports pipeline (crypto-analysis) and fixes what can be fixed on its own:
#   * every 2 hours (schedule)
#   * whenever the "ALERTA: RELATORIOS" message fires: have the Make/n8n scenario that
#     sends the alert also POST to the GitHub API (see README_AUTOHEAL below), which
#     triggers `repository_dispatch` with type `relatorios-alert`
#   * by hand (workflow_dispatch)
#
# scripts/heal-relatorios.mjs does the work: health check with retries, then redeploy of
# the function if it is down, or regeneration of a report whose AI analysis failed.
# When something is left that only a person can fix (VPS/Make stopped sending, wrong
# access code, totals that do not reconcile) the job fails, opens/updates an issue
# labelled `relatorios-alert` with the diagnosis, and GitHub emails the owners.
#
# Secrets/variables:
#   HEALTH_ACCESS_CODE        (secret, required) an active client access code
#   SUPABASE_PUBLISHABLE_KEY  (variable, required) public anon key, already in the bundle
#   SUPABASE_ACCESS_TOKEN     (secret, optional) enables automatic redeploy of the function
#
# README_AUTOHEAL: in Make/n8n, after the alert step add an HTTP request:
#   POST https://api.github.com/repos/ABauerlab/smart-money-flow/dispatches
#   headers: Authorization: Bearer <fine-grained token, Contents: read/write>,
#            Accept: application/vnd.github+json
#   body:    {"event_type":"relatorios-alert"}

on:
  schedule:
    - cron: "17 */2 * * *"
  repository_dispatch:
    types: [relatorios-alert]
  workflow_dispatch:

# One inspection at a time: a burst of alerts must not stack repairs or AI calls.
concurrency:
  group: relatorios-heal
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEALTH_ACCESS_CODE: ${{ secrets.HEALTH_ACCESS_CODE }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Public values, already embedded in the client bundle (.env).
      FUNCTION_URL: https://xinzvskuxnxgjrcqncmy.supabase.co/functions/v1/crypto-analysis
      SUPABASE_PROJECT_REF: xinzvskuxnxgjrcqncmy
      PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect and self-heal
        run: node scripts/heal-relatorios.mjs

      - name: Open or update the alert issue
        if: failure() && hashFiles('heal-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create relatorios-alert --color B60205 --description "Relatórios fora do ar" 2>/dev/null || true
          existing=$(gh issue list --label relatorios-alert --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file heal-report.md
          else
            gh issue create --label relatorios-alert --title "ALERTA: relatórios precisam de atenção" --body-file heal-report.md
          fi

      - name: Close the alert issue once healthy
        if: success() && hashFiles('heal-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label relatorios-alert --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Saudável novamente: $(date -u +%FT%TZ)"
          done
