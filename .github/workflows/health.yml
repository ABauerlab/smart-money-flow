name: Health check (listas)

# Every 2 hours, asks the crypto-analysis function to reconcile the summed totals
# (database aggregate vs. raw rows) and to report how old the last ingested round is.
# The job FAILS when totals diverge or no report arrived for more than 9h, so GitHub
# emails the repo owners: the client no longer has to be the one who notices.
#
# Needs one repository secret: HEALTH_ACCESS_CODE (an active client access code).
# Without it the job is skipped instead of failing.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      HEALTH_ACCESS_CODE: ${{ secrets.HEALTH_ACCESS_CODE }}
      # Public values, already embedded in the client bundle (.env).
      FUNCTION_URL: https://xinzvskuxnxgjrcqncmy.supabase.co/functions/v1/crypto-analysis
      PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check
        run: |
          if [ -z "$HEALTH_ACCESS_CODE" ]; then
            echo "HEALTH_ACCESS_CODE not set, skipping."; exit 0
          fi
          # Up to 3 attempts: cold starts, a transient network blip or a round landing
          # mid-check must not page anyone. Only a persistent failure fails the job.
          status=000
          for attempt in 1 2 3; do
            status=$(curl -sS -m 90 -o health.json -w '%{http_code}' -X POST "$FUNCTION_URL?action=health" \
              -H "Authorization: Bearer $PUBLISHABLE_KEY" -H "Content-Type: application/json" \
              -d "{\"accessCode\":\"$HEALTH_ACCESS_CODE\"}" || echo 000)
            [ "$status" = "200" ] && break
            echo "Attempt $attempt returned HTTP $status"; sleep $((attempt * 20))
          done
          cat health.json 2>/dev/null || true; echo
          [ "$status" = "200" ] || { echo "::error::Health check failed (HTTP $status). See body above: reason=stale/no_rounds means the pipeline stopped sending, mismatch means wrong totals, 5xx means the function itself failed."; exit 1; }
